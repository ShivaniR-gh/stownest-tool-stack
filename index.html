svg .l{font-size:12.5px;font-weight:500;fill:#5b6472}
svg .pill{fill:var(--paper)}
svg .a{fill:none;stroke:#6b6457;stroke-width:2;stroke-linejoin:round}
svg .a.dash{stroke-dasharray:6 6}
.narrow{display:none;max-width:560px;margin:0 auto}
@media (max-width:900px){.wide{display:none}.narrow{display:block}}
.foot{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px 28px;margin-top:22px}
.key{display:flex;flex-wrap:wrap;gap:10px 28px;font-size:15px}
.sw{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:7px}
.dl{display:inline-block;width:28px;border-top:2px dashed #6b6457;vertical-align:4px;margin-right:7px}
.note{color:#5b6472;font-size:14px;margin:0}
