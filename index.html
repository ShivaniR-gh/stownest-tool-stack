<style>
:root{--ink:#1d2430;--paper:#f6f3ee}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,system-ui,sans-serif}
main{max-width:1600px;margin:0 auto;padding:clamp(16px,3vw,48px)}
h1{font-family:'Space Grotesk',sans-serif;font-size:clamp(28px,4.5vw,52px);line-height:1.1;margin:0 0 8px}
.lede{color:#9c4a12;font-size:clamp(16px,1.8vw,22px);margin:0 0 24px}
svg{display:block;width:100%;height:auto}
svg .band{fill:#ece6db}
svg .c{fill:#fffdf9;stroke:#d6cfc1}
svg .c.hub{fill:#f4c08e;stroke:#f4c08e}
svg .c.house{fill:#c9d8f2;stroke:#c9d8f2}
svg text{font-family:Inter,system-ui,sans-serif;fill:#1d2430}
svg .n{font-size:16px;font-weight:700;text-anchor:middle}
svg .n.chip{font-size:13px}
svg .d{font-size:14px;text-anchor:middle}
svg .stg{font-size:14px;font-weight:700;letter-spacing:1.5px;fill:#9c4a12}
svg .l{font-size:13px;fill:#5b6472}
svg .a{fill:none;stroke:#6b6457;stroke-width:2;stroke-linejoin:round}
svg .a.dash{stroke-dasharray:6 6}
.narrow{display:none;max-width:560px;margin:0 auto}
@media (max-width:900px){.wide{display:none}.narrow{display:block}}
.key{display:flex;flex-wrap:wrap;gap:10px 28px;margin-top:20px;font-size:15px}
.sw{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:6px}
.dl{display:inline-block;width:28px;border-top:2px dashed #6b6457;vertical-align:4px;margin-right:6px}
.note{color:#5b6472;font-size:14px;margin:8px 0 0}
</style>
